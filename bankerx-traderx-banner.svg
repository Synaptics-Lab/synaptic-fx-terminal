<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="BankerX and TraderX banner — Colosseum Radar 2026">
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .label { letter-spacing: 0.08em; }
      .ink1 { fill: #e8ecf1; }
      .ink2 { fill: #9aa3ae; }
      .ink3 { fill: #626b77; }
      .settled { fill: #3fd68c; }
      .pending { fill: #e2b03f; }
      .sol { fill: #ff8a3d; }
      .xrpl { fill: #4fb8e7; }
    </style>
  </defs>

  <!-- ledger ground -->
  <rect width="1280" height="320" fill="#07080a"/>
  <rect width="1280" height="3" fill="#3fd68c"/>

  <!-- top strip: protocol labels + submission chip -->
  <text class="mono label ink3" x="64" y="42" font-size="12">SYNAPTICCHAIN — X402-TSWP · ISO 20022 · FDC3 3.0</text>
  <rect x="1024" y="24" width="192" height="28" rx="3" fill="#0a0b0e" stroke="#2b313a"/>
  <text class="mono label pending" x="1120" y="46" font-size="12" text-anchor="middle">COLOSSEUM RADAR 2026</text>

  <line x1="64" y1="72" x2="1216" y2="72" stroke="#1c2026"/>

  <!-- left: BankerX wordmark -->
  <text class="sans ink1" x="64" y="168" font-size="72" font-weight="700" letter-spacing="-0.02em">Banker<tspan class="settled">X</tspan></text>
  <text class="sans ink2" x="66" y="206" font-size="16">Zero-trust banking clearinghouse. No bridge. No wrapped asset.</text>
  <text class="mono ink3" x="66" y="230" font-size="11" letter-spacing="0.06">Three rails settle the same instruction atomically — or none settle.</text>

  <!-- divider -->
  <line x1="636" y1="88" x2="636" y2="232" stroke="#1c2026"/>

  <!-- right: TraderX -> BankerX handoff -->
  <text class="mono label ink3" x="668" y="102" font-size="11">FDC3 3.0 DESKTOP AGENT BRIDGING</text>

  <rect x="668" y="116" width="200" height="64" rx="4" fill="#0e1013" stroke="#2b313a"/>
  <text class="mono label ink3" x="684" y="138" font-size="11">FINOS TRADERX</text>
  <text class="sans ink1" x="684" y="162" font-size="17">Order blotter</text>

  <!-- arrow: fdc3.raiseIntent -->
  <line x1="876" y1="148" x2="1020" y2="148" stroke="#3e454f" stroke-width="1.5"/>
  <polygon points="1020,148 1010,143 1010,153" fill="#3e454f"/>
  <text class="mono ink2" x="948" y="140" font-size="11" text-anchor="middle">fdc3.raiseIntent</text>
  <text class="mono ink3" x="948" y="162" font-size="10" text-anchor="middle">SettlePayment intent</text>

  <rect x="1028" y="116" width="188" height="64" rx="4" fill="#0e1013" stroke="#3fd68c"/>
  <text class="mono label settled" x="1044" y="138" font-size="11">ADR-555 GATE</text>
  <text class="sans ink1" x="1044" y="162" font-size="17">Atomic settle</text>

  <!-- bottom strip: rails + FINOS PRs -->
  <line x1="64" y1="240" x2="1216" y2="240" stroke="#1c2026"/>

  <rect x="64" y="254" width="244" height="32" rx="3" fill="#0a0b0e" stroke="#1c2026"/>
  <rect x="76" y="265" width="10" height="10" fill="#ff8a3d"/>
  <text class="mono ink2" x="94" y="275" font-size="12">SOLANA DEVNET · TOKEN-2022</text>

  <rect x="316" y="254" width="212" height="32" rx="3" fill="#0a0b0e" stroke="#1c2026"/>
  <rect x="328" y="265" width="10" height="10" fill="#4fb8e7"/>
  <text class="mono ink2" x="346" y="275" font-size="12">XRPL TESTNET (ALTNET)</text>

  <rect x="536" y="254" width="232" height="32" rx="3" fill="#0a0b0e" stroke="#1c2026"/>
  <rect x="548" y="265" width="10" height="10" fill="#3fd68c"/>
  <text class="mono ink2" x="566" y="275" font-size="12">SYNAPTICCHAIN L1 TESTNET</text>

  <text class="mono ink3" x="1216" y="275" font-size="12" text-anchor="end">FDC3 PR #2204 MERGED · traderX PR #470 OPEN</text>
</svg>